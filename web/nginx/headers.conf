# Included in every location: add_header in a location drops the server-level ones.
# No X-Frame-Options: Telegram Web loads Mini Apps in a cross-site iframe; frame-ancestors controls embedding.
# - frame-ancestors: the Telegram Web clients (web.telegram.org/k and /a, webk., weba.). Native Telegram
#   apps load the Mini App top-level, where frame-ancestors does not apply.
# - connect-src: the API and WebSocket are same-origin. 'self' covers wss to the same host in CSP3; the
#   explicit wss://$host also covers older WebKit (iOS WebViews) without allowing every wss: host.
# - script-src: telegram-web-app.js from telegram.org; it makes no requests of its own.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://$host; frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://weba.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
