name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anora
          POSTGRES_PASSWORD: anora
          POSTGRES_DB: anora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anora"
          --health-interval 2s
          --health-retries 30
    env:
      ANORA_TEST_DATABASE_URL: postgres://anora:anora@localhost:5432/anora?sslmode=disable
      ANORA_TEST_RUNNER_IMAGE: anora-agent:ci
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - uses: docker/setup-buildx-action@v4
      - name: Build runner image for integration tests
        uses: docker/build-push-action@v7
        with:
          context: runner
          load: true
          tags: anora-agent:ci
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - run: go vet ./...
      # -p 1: Docker integration tests must not run concurrently (see README).
      - run: go test -p 1 -count=1 ./...

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  runner:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
