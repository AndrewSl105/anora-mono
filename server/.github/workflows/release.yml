name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVICE_IMAGE: ghcr.io/andrewsl105/anora-runner
  RUNNER_IMAGE: ghcr.io/andrewsl105/anora-agent

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Anora Runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.SERVICE_IMAGE }}:${{ github.sha }}
            ${{ env.SERVICE_IMAGE }}:latest
          cache-from: type=gha,scope=service
          cache-to: type=gha,mode=max,scope=service
      - name: Runner image
        uses: docker/build-push-action@v7
        with:
          context: runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.RUNNER_IMAGE }}:${{ github.sha }}
            ${{ env.RUNNER_IMAGE }}:latest
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # ssh-action v1.2.5 removed script_stop; `set -e` stops on the first failure.
          script: |
            set -e
            cd /srv/anora
            # anora-client's release workflow deploys to the same directory: one deploy at a time.
            exec 9>/srv/anora/.deploy.lock
            flock 9
            # Anora Runner starts runners from the local image and never pulls it.
            docker pull ghcr.io/andrewsl105/anora-agent:latest
            docker compose -f docker-compose.deploy.yml pull anora
            # Only this repository's service; Postgres, the Docker proxy, Caddy and the
            # client keep running (first start and compose file changes: see README).
            docker compose -f docker-compose.deploy.yml up -d --no-deps anora
            docker image prune -f
