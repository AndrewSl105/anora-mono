openapi: 3.1.0
info:
  title: Anora Runner API
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 0.1.0
  description: |
    REST API of Anora Runner. See docs/API.md for behaviour, the task state
    machine, timeline event types and the WebSocket protocol.
    Every non-GET request must send `X-Requested-With: anora`.
servers:
  - url: /
security:
  - session: []
  - telegramBearer: []
tags:
  - name: auth
  - name: projects
  - name: tasks
  - name: system

paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with password and TOTP
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, totp]
              additionalProperties: false
              properties:
                password: { type: string }
                totp: { type: string, description: Current 6-digit code }
      responses:
        '200':
          description: Logged in; sets the anora_session cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionInfo' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/telegram:
    post:
      operationId: loginTelegram
      tags: [auth]
      summary: Log in from the Telegram Mini App
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              additionalProperties: false
              properties:
                init_data: { type: string, description: Telegram.WebApp.initData verbatim }
      responses:
        '200':
          description: |
            Logged in; sets the anora_session cookie and also returns the session as `token`.
            Telegram Web embeds the Mini App in a cross-site iframe where the SameSite=Lax cookie
            is not sent: keep `token` in memory (never in storage) and send it as
            `Authorization: Bearer <token>`; open the WebSocket with a ticket (`POST /api/v1/ws/ticket`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SessionInfo'
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, description: 'Session token for `Authorization: Bearer` (Telegram sessions only)' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /api/v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Session check
      responses:
        '200':
          description: Session is valid
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionInfo' } } }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limit'
        - { name: cursor, in: query, schema: { type: string }, description: next_cursor from the previous page }
      responses:
        '200':
          description: A page of projects
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  next_cursor: { type: string }
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
                - $ref: '#/components/schemas/ProjectFields'
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      responses:
        '200':
          description: The project
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      description: Omitted fields are unchanged; "" or 0 resets an override to the server default.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectFields' } } }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: archiveProject
      tags: [projects]
      summary: Archive a project
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: Archived
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/projects/{id}/repositories:
    post:
      operationId: addRepository
      tags: [projects]
      summary: Add a repository to a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, installation_id]
              additionalProperties: false
              properties:
                full_name: { type: string, example: andrewsl105/vatary-server }
                installation_id: { type: integer, format: int64 }
                base_branch: { allOf: [{ $ref: '#/components/schemas/BranchName' }], default: dev }
                is_default: { type: boolean, default: false }
      responses:
        '201':
          description: Added
          content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/projects/{id}/repositories/{repoId}:
    patch:
      operationId: updateRepository
      tags: [projects]
      summary: Update a repository's base branch or default flag
      description: |
        Omitted fields are unchanged. `is_default: true` clears the flag on the
        project's other repositories; `is_default: false` on the current default
        is 409 `conflict`. Changing `base_branch` is 409 `in_use` while tasks
        that are not completed/failed/cancelled use the repository.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: repoId, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                base_branch: { $ref: '#/components/schemas/BranchName' }
                is_default: { type: boolean }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteRepository
      tags: [projects]
      summary: Remove a repository
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: repoId, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/github/repositories:
    get:
      operationId: listGitHubRepositories
      tags: [projects]
      summary: Repositories the GitHub App can see
      responses:
        '200':
          description: Repositories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GitHubRepo' } }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks, newest first
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: Comma-separated statuses }
        - $ref: '#/components/parameters/Limit'
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of tasks
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Task' } }
                  next_cursor: { type: string }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      description: |
        JSON, or `multipart/form-data` with the same fields plus image files in
        `files[]`. The attachments are listed in the task's `created` event.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, prompt]
              additionalProperties: false
              properties:
                project_id: { type: string }
                repository_id: { type: integer, format: int64, description: Defaults to the project's default repository }
                title: { type: string, description: Defaults to the first line of the prompt }
                prompt: { type: string }
          multipart/form-data:
            schema:
              type: object
              required: [project_id, prompt]
              additionalProperties: false
              properties:
                project_id: { type: string }
                repository_id: { type: integer, format: int64, description: Defaults to the project's default repository }
                title: { type: string, description: Defaults to the first line of the prompt }
                prompt: { type: string }
                'files[]':
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
                  description: PNG, JPEG, WebP or GIF (not animated), at most 40 MB each, 100 MB together; type detected from the content
      responses:
        '201':
          description: Queued
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Task with latest run, open question and PR info
      parameters: [{ $ref: '#/components/parameters/TaskID' }]
      responses:
        '200':
          description: The task
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/events:
    get:
      operationId: listTaskEvents
      tags: [tasks]
      summary: Task timeline, oldest first (or newest first with before_id)
      description: |
        Forward (default): events after `after_id`, oldest first.
        Backward: events before `before_id`, newest first; `before_id=0`
        starts at the newest event. In backward mode pass `next_cursor` back
        as `before_id`. `before_id` cannot be combined with `after_id`/`cursor` (400).
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - { name: after_id, in: query, schema: { type: integer, format: int64 }, description: Last event id the client has }
        - { name: cursor, in: query, schema: { type: string }, description: Alias of after_id }
        - { name: before_id, in: query, schema: { type: integer, format: int64, minimum: 0 }, description: 'Page backwards from this id (exclusive), newest first; 0 = from the newest event' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  next_cursor: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/runs:
    get:
      operationId: listTaskRuns
      tags: [tasks]
      summary: Runs of a task, oldest first (including a queued run)
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/Limit'
        - { name: cursor, in: query, schema: { type: string }, description: next_cursor from the previous page }
      responses:
        '200':
          description: A page of runs
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Run' } }
                  next_cursor: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/diff:
    get:
      operationId: getTaskDiff
      tags: [tasks]
      summary: git diff base...branch from the workspace (max 1 MB)
      parameters: [{ $ref: '#/components/parameters/TaskID' }]
      responses:
        '200':
          description: The diff
          content:
            application/json:
              schema:
                type: object
                required: [diff, truncated, base, branch]
                properties:
                  diff: { type: string }
                  truncated: { type: boolean }
                  base: { type: string }
                  branch: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/attachments/{attachmentId}:
    get:
      operationId: getAttachment
      tags: [tasks]
      summary: Download an attachment (owner only)
      description: |
        The cleaned image as stored (metadata removed), or with `thumb=1` a JPEG
        whose longest side is at most 480 px. `410 gone` once the attachment was
        removed (the task completed, or workspace retention ran).
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - { name: attachmentId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: thumb, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/answer:
    post:
      operationId: answerQuestion
      tags: [tasks]
      summary: Answer the open question (first answer wins)
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, text]
              additionalProperties: false
              properties:
                question_id: { type: string }
                text: { type: string }
      responses:
        '200':
          description: Answer accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/message:
    post:
      operationId: sendMessage
      tags: [tasks]
      summary: Follow-up message (queued while a run is active)
      description: |
        `queued`/`preparing`/`running`/`waiting_input`/`pushing`: the text is queued
        (`queued_message` on the task, event `message` with `delivery: queued`) and
        starts the next run when the current one ends. `paused`/`pr_open`/`completed`:
        starts a new run now (`delivery: new_run`). Otherwise `409`.
        JSON, or `multipart/form-data` with `text` plus image files in `files[]`;
        the attachments are listed in the `message` event and reach the run that
        handles the text.
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string }
          multipart/form-data:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string }
                'files[]':
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
                  description: PNG, JPEG, WebP or GIF (not animated), at most 40 MB each, 100 MB together; type detected from the content
      responses:
        '200':
          description: Queued, or a new run was started
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/interrupt:
    post:
      operationId: interruptTask
      tags: [tasks]
      summary: Stop the current turn, keep the session
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Interrupted, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags: [tasks]
      summary: Cancel the task
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/retry:
    post:
      operationId: retryTask
      tags: [tasks]
      summary: Queue a failed or cancelled task again
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/stats:
    get:
      operationId: getStats
      tags: [system]
      summary: Running/queued counts and cost
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                required: [running, queued, waiting_input, cost_usd_today, cost_usd_month]
                properties:
                  running: { type: integer }
                  queued: { type: integer }
                  waiting_input: { type: integer }
                  cost_usd_today: { type: number }
                  cost_usd_month: { type: number }

  /api/v1/ws/ticket:
    post:
      operationId: createWebSocketTicket
      tags: [system]
      summary: Single-use ticket to open the WebSocket without a cookie
      description: For sessions that authenticate with a bearer token (Telegram Web). The ticket is valid once, for `expires_in` seconds.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_in]
                properties:
                  ticket: { type: string }
                  expires_in: { type: integer, description: Seconds }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/ws:
    get:
      operationId: openWebSocket
      tags: [system]
      summary: WebSocket (see docs/API.md for messages)
      description: Authenticated by the session cookie, or by a `ticket` from `POST /api/v1/ws/ticket`.
      security:
        - session: []
        - {}
      parameters:
        - name: ticket
          in: query
          required: false
          schema: { type: string }
          description: Single-use ticket (instead of the cookie)
      responses:
        '101': { description: Switching protocols }
        '401': { $ref: '#/components/responses/Error' }

  /webhooks/github:
    post:
      operationId: githubWebhook
      tags: [system]
      summary: GitHub webhook (X-Hub-Signature-256)
      security: []
      responses:
        '200': { description: Accepted }
        '401': { description: Bad signature }

  /healthz:
    get:
      operationId: healthz
      tags: [system]
      summary: Database and Docker reachability
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Health' }

  /metrics:
    get:
      operationId: metrics
      tags: [system]
      summary: Prometheus metrics (internal network only)
      security: []
      responses:
        '200': { description: Metrics, content: { text/plain: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: anora_session
    telegramBearer:
      type: http
      scheme: bearer
      description: The `token` from `POST /api/v1/auth/telegram`; accepted only for Telegram sessions.

  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, enum: [anora] }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    TaskID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    OK:
      description: OK
      content:
        application/json:
          schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
    Health:
      description: Health checks
      content:
        application/json:
          schema:
            type: object
            required: [ok, checks]
            properties:
              ok: { type: boolean }
              checks: { type: object, additionalProperties: { type: string } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    SessionInfo:
      type: object
      required: [ok, kind]
      properties:
        ok: { type: boolean }
        kind: { type: string, enum: [web, telegram] }

    ProjectFields:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        instructions: { type: string }
        services: { type: array, items: { type: string, enum: [postgres, redis] } }
        env: { type: object, additionalProperties: { type: string } }
        runner_image: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        max_turns: { type: [integer, 'null'] }
        max_budget_usd: { type: [number, 'null'] }
        max_duration_sec: { type: [integer, 'null'] }
        runner_memory: { type: [string, 'null'], example: 3g }
        runner_cpus: { type: [number, 'null'] }
        telegram_thread_id: { type: [integer, 'null'], format: int64 }
        archived: { type: boolean }

    Project:
      type: object
      required: [id, name, instructions, services, env, archived, created_at, updated_at, repositories]
      properties:
        id: { type: string }
        name: { type: string }
        instructions: { type: string }
        services: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        runner_image: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        max_turns: { type: [integer, 'null'] }
        max_budget_usd: { type: [number, 'null'] }
        max_duration_sec: { type: [integer, 'null'] }
        runner_memory: { type: [string, 'null'] }
        runner_cpus: { type: [number, 'null'] }
        telegram_thread_id: { type: [integer, 'null'], format: int64 }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        repositories: { type: array, items: { $ref: '#/components/schemas/Repository' } }

    Repository:
      type: object
      required: [id, project_id, full_name, base_branch, installation_id, is_default]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: string }
        full_name: { type: string }
        base_branch: { type: string }
        installation_id: { type: integer, format: int64 }
        is_default: { type: boolean }

    BranchName:
      type: string
      maxLength: 200
      pattern: '^[A-Za-z0-9_][A-Za-z0-9._/-]*$'
      description: Plain git branch name; no "..", "//", trailing "/", "." or ".lock"

    GitHubRepo:
      type: object
      required: [full_name, default_branch, private, installation_id]
      properties:
        full_name: { type: string }
        default_branch: { type: string }
        private: { type: boolean }
        installation_id: { type: integer, format: int64 }

    TaskStatus:
      type: string
      enum: [queued, preparing, running, waiting_input, paused, pushing, pr_open, completed, failed, cancelled]

    Task:
      type: object
      required: [id, project_id, repository_id, title, prompt, status, cost_usd_total, turns, source, created_at, updated_at, last_activity, last_activity_at, queued_message]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: string }
        repository_id: { type: integer, format: int64 }
        title: { type: string }
        prompt: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        status_reason: { type: [string, 'null'] }
        branch: { type: [string, 'null'] }
        session_id: { type: [string, 'null'] }
        pr_number: { type: [integer, 'null'] }
        pr_url: { type: [string, 'null'] }
        ci_status: { type: [string, 'null'], enum: [pending, success, failure, null] }
        cost_usd_total: { type: number }
        turns: { type: integer, description: Claude turns across all runs }
        source: { type: string, enum: [web, telegram, api] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        paused_at: { type: [string, 'null'], format: date-time }
        last_activity:
          type: [string, 'null']
          maxLength: 120
          description: 'Latest tool_use summary or status change ("<status>" or "<status>: <reason>"), one line'
        last_activity_at: { type: [string, 'null'], format: date-time }
        queued_message:
          type: [string, 'null']
          description: Text sent while a run was active (several messages joined by a blank line); it becomes the input of the next run when the current one ends. `null` when nothing is queued.

    TaskView:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            repository: { oneOf: [{ $ref: '#/components/schemas/Repository' }, { type: 'null' }] }
            latest_run: { oneOf: [{ $ref: '#/components/schemas/Run' }, { type: 'null' }] }
            open_question: { oneOf: [{ $ref: '#/components/schemas/Question' }, { type: 'null' }] }

    Run:
      type: object
      required: [id, task_id, kind, input, last_seq, cost_usd, turns]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        kind: { type: string, enum: [initial, resume, followup, retry] }
        input: { type: string }
        container_id: { type: [string, 'null'] }
        exit_code: { type: [integer, 'null'] }
        last_seq: { type: integer, format: int64 }
        cost_usd: { type: number, description: This run's own cost (not the session total) }
        turns: { type: integer, description: Last usage.turns the runner reported for this run }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    Question:
      type: object
      required: [id, task_id, run_id, text, created_at]
      properties:
        id: { type: string, description: '"<run_id>-<runner question id>"; pass it to /answer' }
        task_id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        text: { type: string }
        options: { type: [array, 'null'], items: { type: string } }
        answer: { type: [string, 'null'] }
        answered_via: { type: [string, 'null'], enum: [web, telegram, null] }
        created_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }

    Event:
      description: |
        Timeline event, discriminated by `type`. Runner events (PROTOCOL.md)
        have `seq` set and their `payload` is the runner event verbatim
        (including `type`, `ts`, `seq`); backend events have `seq: null`.
      oneOf:
        - $ref: '#/components/schemas/ReadyEvent'
        - $ref: '#/components/schemas/StartedEvent'
        - $ref: '#/components/schemas/AssistantTextEvent'
        - $ref: '#/components/schemas/ToolUseEvent'
        - $ref: '#/components/schemas/ToolResultEvent'
        - $ref: '#/components/schemas/QuestionEvent'
        - $ref: '#/components/schemas/UsageEvent'
        - $ref: '#/components/schemas/CommittedEvent'
        - $ref: '#/components/schemas/DoneEvent'
        - $ref: '#/components/schemas/PausedEvent'
        - $ref: '#/components/schemas/ErrorEvent'
        - $ref: '#/components/schemas/CreatedEvent'
        - $ref: '#/components/schemas/StatusEvent'
        - $ref: '#/components/schemas/AnswerEvent'
        - $ref: '#/components/schemas/MessageEvent'
        - $ref: '#/components/schemas/MessageDroppedEvent'
        - $ref: '#/components/schemas/InterruptEvent'
        - $ref: '#/components/schemas/RunStartedEvent'
        - $ref: '#/components/schemas/RunFinishedEvent'
        - $ref: '#/components/schemas/PrOpenedEvent'
        - $ref: '#/components/schemas/PrUpdatedEvent'
        - $ref: '#/components/schemas/PrClosedEvent'
        - $ref: '#/components/schemas/CiEvent'
        - $ref: '#/components/schemas/DiffRejectedEvent'
      discriminator:
        propertyName: type
        mapping:
          ready: '#/components/schemas/ReadyEvent'
          started: '#/components/schemas/StartedEvent'
          assistant_text: '#/components/schemas/AssistantTextEvent'
          tool_use: '#/components/schemas/ToolUseEvent'
          tool_result: '#/components/schemas/ToolResultEvent'
          question: '#/components/schemas/QuestionEvent'
          usage: '#/components/schemas/UsageEvent'
          committed: '#/components/schemas/CommittedEvent'
          done: '#/components/schemas/DoneEvent'
          paused: '#/components/schemas/PausedEvent'
          error: '#/components/schemas/ErrorEvent'
          created: '#/components/schemas/CreatedEvent'
          status: '#/components/schemas/StatusEvent'
          answer: '#/components/schemas/AnswerEvent'
          message: '#/components/schemas/MessageEvent'
          message_dropped: '#/components/schemas/MessageDroppedEvent'
          interrupt: '#/components/schemas/InterruptEvent'
          run_started: '#/components/schemas/RunStartedEvent'
          run_finished: '#/components/schemas/RunFinishedEvent'
          pr_opened: '#/components/schemas/PrOpenedEvent'
          pr_updated: '#/components/schemas/PrUpdatedEvent'
          pr_closed: '#/components/schemas/PrClosedEvent'
          ci: '#/components/schemas/CiEvent'
          diff_rejected: '#/components/schemas/DiffRejectedEvent'

    EventType:
      type: string
      enum: [ready, started, assistant_text, tool_use, tool_result, question, usage, committed, done, paused, error, created, status, answer, message, message_dropped, interrupt, run_started, run_finished, pr_opened, pr_updated, pr_closed, ci, diff_rejected]

    EventBase:
      type: object
      required: [id, task_id, run_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        run_id: { type: [integer, 'null'], format: int64 }
        created_at: { type: string, format: date-time }

    RunnerPayloadBase:
      type: object
      required: [ts, seq]
      properties:
        ts: { type: string, format: date-time }
        seq: { type: integer, format: int64 }

    # ---- runner events ----

    ReadyEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [ready] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/ReadyPayload' }

    ReadyPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, runner_version]
          properties:
            type: { type: string, enum: [ready] }
            runner_version: { type: string }

    StartedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [started] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/StartedPayload' }

    StartedPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, session_id, model]
          properties:
            type: { type: string, enum: [started] }
            session_id: { type: string }
            model: { type: string }

    AssistantTextEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [assistant_text] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/AssistantTextPayload' }

    AssistantTextPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, text]
          properties:
            type: { type: string, enum: [assistant_text] }
            text: { type: string }

    ToolUseEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [tool_use] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/ToolUsePayload' }

    ToolUsePayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, tool, summary]
          properties:
            type: { type: string, enum: [tool_use] }
            tool: { type: string }
            summary: { type: string, description: 'Short, human-readable, e.g. "Edit src/tables/export.ts"' }

    ToolResultEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [tool_result] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/ToolResultPayload' }

    ToolResultPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, tool, ok]
          properties:
            type: { type: string, enum: [tool_result] }
            tool: { type: string }
            ok: { type: boolean }
            summary: { type: string, description: Only when ok is false; first line of the error }

    QuestionEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [question] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/QuestionPayload' }

    QuestionPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, question_id, text]
          properties:
            type: { type: string, enum: [question] }
            question_id: { type: string, description: 'Runner-local id (q1, q2, …); the API question id is "<run_id>-<question_id>"' }
            text: { type: string }
            options: { type: array, items: { type: string } }

    UsageEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [usage] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/UsagePayload' }

    UsagePayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, cost_usd_total, input_tokens, output_tokens, turns]
          properties:
            type: { type: string, enum: [usage] }
            cost_usd_total: { type: number, description: Cumulative for the Claude session }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            turns: { type: integer, description: Turns in this run }

    CommittedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [committed] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/CommittedPayload' }

    CommittedPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, sha, files_changed, insertions, deletions]
          properties:
            type: { type: string, enum: [committed] }
            sha: { type: string }
            files_changed: { type: integer }
            insertions: { type: integer }
            deletions: { type: integer }

    DoneEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [done] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/DonePayload' }

    DonePayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, session_id, summary, no_changes, cost_usd_total]
          properties:
            type: { type: string, enum: [done] }
            session_id: { type: string }
            summary: { type: string }
            no_changes: { type: boolean }
            cost_usd_total: { type: number }

    PausedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [paused] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/PausedPayload' }

    PausedPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, session_id, reason, question_id]
          properties:
            type: { type: string, enum: [paused] }
            session_id: { type: string }
            reason: { type: string, enum: [question_timeout] }
            question_id: { type: string }

    ErrorEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [error] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/ErrorPayload' }

    ErrorPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, code, message]
          properties:
            type: { type: string, enum: [error] }
            code: { type: string, description: 'no_auth, bad_command, commit_failed, limit_exceeded, sdk_error or internal' }
            message: { type: string }
            session_id: { type: string }

    # ---- backend events ----

    Attachment:
      type: object
      description: An image attached to a task or a message. Download it with `GET /tasks/{id}/attachments/{id}`.
      required: [id, name, mime, size, width, height]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: Original file name }
        mime: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif] }
        size: { type: integer, format: int64, description: Bytes of the stored (cleaned) file }
        width: { type: integer }
        height: { type: integer }

    CreatedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [created] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/CreatedPayload' }

    CreatedPayload:
      type: object
      required: [attachments]
      properties:
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' }, description: Images attached to the task (may be empty) }

    StatusEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [status] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/StatusPayload' }

    StatusPayload:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/TaskStatus' }
        reason: { type: string }

    AnswerEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [answer] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/AnswerPayload' }

    AnswerPayload:
      type: object
      required: [question_id, text, answered_via]
      properties:
        question_id: { type: string, description: API question id ("<run_id>-<runner id>") }
        text: { type: string }
        answered_via: { type: string, enum: [web, telegram] }

    MessageEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [message] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/MessagePayload' }

    MessagePayload:
      type: object
      required: [text, delivery]
      properties:
        text: { type: string }
        delivery:
          type: string
          enum: [queued, new_run, injected]
          description: '`queued`: waits for the active run to end, then starts the next run. `new_run`: started a run right away. `injected`: only in timelines recorded before messages were queued (such text was not delivered reliably).'
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' }, description: Images sent with the message; absent when there are none }

    MessageDroppedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [message_dropped] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/MessageDroppedPayload' }

    MessageDroppedPayload:
      type: object
      required: [text, reason]
      properties:
        text: { type: string, description: The queued text that was not sent }
        reason: { type: string, enum: [failed, cancelled], description: The status that ended the task before the text could start a run }

    InterruptEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [interrupt] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/InterruptPayload' }

    InterruptPayload:
      type: object
      additionalProperties: false
      properties: {}

    RunStartedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [run_started] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/RunStartedPayload' }

    RunStartedPayload:
      type: object
      required: [run_id, kind]
      properties:
        run_id: { type: integer, format: int64 }
        kind: { type: string, enum: [initial, resume, followup, retry] }

    RunFinishedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [run_finished] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/RunFinishedPayload' }

    RunFinishedPayload:
      type: object
      required: [run_id, exit_code]
      properties:
        run_id: { type: integer, format: int64 }
        exit_code: { type: integer, description: Runner exit code (PROTOCOL.md) }

    PrOpenedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [pr_opened] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/PrOpenedPayload' }

    PrOpenedPayload:
      type: object
      required: [number, url]
      properties:
        number: { type: integer }
        url: { type: string }

    PrUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [pr_updated] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/PrUpdatedPayload' }

    PrUpdatedPayload:
      type: object
      required: [number, url]
      properties:
        number: { type: integer }
        url: { type: string }

    PrClosedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [pr_closed] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/PrClosedPayload' }

    PrClosedPayload:
      type: object
      required: [number, merged]
      properties:
        number: { type: integer }
        merged: { type: boolean }

    CiEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [ci] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/CiPayload' }

    CiPayload:
      type: object
      required: [status, name, url]
      properties:
        status: { type: string, enum: [pending, success, failure] }
        name: { type: string }
        url: { type: string }

    DiffRejectedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [diff_rejected] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/DiffRejectedPayload' }

    DiffRejectedPayload:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
