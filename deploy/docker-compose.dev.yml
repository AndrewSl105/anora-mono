# Local development: server + postgres + docker-proxy, with the fake agent
# (no Claude), no GitHub App and no Telegram bot. The web client runs outside
# Docker with `npm run dev` (Vite proxies /api and /api/v1/ws to the server).
#
#   make dev-setup    # build images, print a password hash and TOTP secret
#   make dev          # start this stack and the Vite dev server
#
# Run from the repository root: workspaces live in ./.dev/workspaces and must
# have the same absolute path on the host and in the container.
name: fleetpocket-dev

services:
  server:
    build: { context: ../server }
    image: fleetpocket-server:dev
    restart: unless-stopped
    env_file:
      # ADMIN_PASSWORD_HASH, ADMIN_TOTP_SECRET (and optionally anything else).
      - path: .env.dev
        required: false
    environment:
      DATABASE_URL: postgres://fleetpocket:fleetpocket@postgres:5432/fleetpocket?sslmode=disable
      DOCKER_HOST: tcp://docker-proxy:2375
      WORKSPACES_DIR: ${FLEETPOCKET_DEV_WORKSPACES:-${PWD}/.dev/workspaces}
      ATTACHMENTS_DIR: ${FLEETPOCKET_DEV_ATTACHMENTS:-${PWD}/.dev/attachments}
      RUNNER_IMAGE: fleetpocket-agent:dev
      FLEETPOCKET_RUNNER_FAKE: "true"
      COOKIE_INSECURE: "true"
      SECRETS_SCAN: "off"
      # The Vite dev server; its WebSocket proxy keeps the browser's Origin.
      CORS_ORIGINS: ${FLEETPOCKET_DEV_CLIENT_ORIGIN:-http://localhost:5173}
      PUBLIC_BASE_URL: ${FLEETPOCKET_DEV_CLIENT_ORIGIN:-http://localhost:5173}
      WEB_APP_URL: ${FLEETPOCKET_DEV_CLIENT_ORIGIN:-http://localhost:5173}
      SESSION_SECRET: dev-only-not-a-secret
      # Docker Desktop's file sharing (macOS) can report another owner for the
      # bind-mounted workspaces now and then, and git then refuses them
      # ("dubious ownership"). Development only; Linux keeps real uids.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      QUESTION_TIMEOUT: 20m
    ports:
      - "127.0.0.1:${FLEETPOCKET_DEV_PORT:-8080}:8080"
    volumes:
      - ${FLEETPOCKET_DEV_WORKSPACES:-${PWD}/.dev/workspaces}:${FLEETPOCKET_DEV_WORKSPACES:-${PWD}/.dev/workspaces}
      - ${FLEETPOCKET_DEV_ATTACHMENTS:-${PWD}/.dev/attachments}:${FLEETPOCKET_DEV_ATTACHMENTS:-${PWD}/.dev/attachments}
    networks: [default, internal]
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      agent:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetpocket
      POSTGRES_PASSWORD: fleetpocket
      POSTGRES_DB: fleetpocket
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetpocket -d fleetpocket"]
      interval: 2s
      retries: 30

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      POST: 1
      EXEC: 0
      BUILD: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  # Builds the agent image fleetpocket-agent:dev (the server never pulls or builds
  # it); the container only prints a line and exits.
  agent:
    build: { context: ../agent }
    image: fleetpocket-agent:dev
    entrypoint: ["node", "-e", "console.log('fleetpocket-agent:dev built')"]
    network_mode: none

volumes:
  pgdata:

networks:
  # `default` gives the server egress (clones of public GitHub repos) and the
  # published port; `internal` holds Postgres and the Docker proxy only.
  internal:
    internal: true
