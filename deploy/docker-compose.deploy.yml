# /srv/anora/docker-compose.deploy.yml — with Caddyfile and .env the only files on the server.
# Caddy is the only service with published ports (80/443). It terminates TLS for
# ANORA_DOMAIN and routes /api, /webhooks and /healthz to anora:8080 and
# everything else to anora-client:80 over the `proxy` network (see Caddyfile).
# Each release workflow pulls and restarts only its own service:
#   anora-runner → anora (and pulls the anora-agent image), anora-client → anora-client.
services:
  anora:
    image: ghcr.io/andrewsl105/anora-runner:${ANORA_TAG:-latest}
    container_name: anora
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      WORKSPACES_DIR: /srv/anora/workspaces
      GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github-app.pem
      DATABASE_URL: postgres://anora:${PG_PASSWORD}@anora-postgres:5432/anora?sslmode=disable
    volumes:
      # Same path on the host and in the container, so bind mounts of runner
      # workspaces resolve on the host. Must be owned by uid 1000.
      - /srv/anora/workspaces:/srv/anora/workspaces
      - /srv/anora/secrets/github-app.pem:/secrets/github-app.pem:ro
    networks: [proxy, internal]
    depends_on:
      anora-postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started

  anora-postgres:
    image: postgres:17-alpine
    container_name: anora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anora
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: anora
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anora -d anora"]
      interval: 5s
      retries: 20

  # Filtered, read-only-socket Docker API for Anora Runner only. No exec,
  # no build, no swarm, no secrets.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: anora-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      POST: 1
      EXEC: 0
      BUILD: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  anora-client:
    image: ghcr.io/andrewsl105/anora-client:${CLIENT_TAG:-latest}
    container_name: anora-client
    restart: unless-stopped
    networks: [proxy]

  caddy:
    image: caddy:2.11.7-alpine
    container_name: anora-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      ANORA_DOMAIN: ${ANORA_DOMAIN:?set ANORA_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates and ACME account: keep it
      - caddy_config:/config
    networks: [proxy]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # Caddy, anora and anora-client. Owned by this file (Compose names it
  # anora_proxy); nothing outside this stack needs it.
  proxy: {}
  internal:
    internal: true
