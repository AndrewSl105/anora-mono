# /srv/anora/docker-compose.deploy.yml — copied to the server by the release
# workflow together with the Caddyfile; .env is created by hand (README).
#
# caddy is the only service with published ports (80/443). It terminates TLS for
# ANORA_DOMAIN and routes /api, /webhooks and /healthz to server:8080 and
# everything else to web:80 over the `stack` network (see Caddyfile).
# postgres and docker-proxy sit on `internal`, which has no egress. Agent
# containers are started by the server through docker-proxy, each in its own
# task network; they never join `stack` or `internal`.
name: anora

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      ANORA_DOMAIN: ${ANORA_DOMAIN:?set ANORA_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates and ACME account: keep it
      - caddy_config:/config
    networks: [stack]

  web:
    image: ghcr.io/andrewsl105/anora-web:${WEB_TAG:-latest}
    restart: unless-stopped
    networks: [stack]

  server:
    image: ghcr.io/andrewsl105/anora-server:${SERVER_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      WORKSPACES_DIR: /srv/anora/workspaces
      GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github-app.pem
      DATABASE_URL: postgres://anora:${PG_PASSWORD}@postgres:5432/anora?sslmode=disable
    volumes:
      # Same path on the host and in the container, so bind mounts of agent
      # workspaces resolve on the host. Must be owned by uid 1000.
      - /srv/anora/workspaces:/srv/anora/workspaces
      - /srv/anora/secrets/github-app.pem:/secrets/github-app.pem:ro
    # stack: Caddy reaches it, and it reaches GitHub, Telegram and registries.
    networks: [stack, internal]
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anora
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: anora
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anora -d anora"]
      interval: 5s
      retries: 20

  # Filtered, read-only-socket Docker API for the server only. No exec,
  # no build, no swarm, no secrets.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      POST: 1
      EXEC: 0
      BUILD: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # caddy, web and server.
  stack: {}
  # postgres and docker-proxy (and server): no egress.
  internal:
    internal: true
